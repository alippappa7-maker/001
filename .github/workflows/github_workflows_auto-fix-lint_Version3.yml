name: Auto Fix Lint & Format on CI Failure

on:
  workflow_run:
    workflows: ["CI"]   # غيّر "CI" لاسم workflow البناء/اختبار عندك
    types: [completed]

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project type and run auto-fixers
        shell: bash
        run: |
          set -e
          FIXED=false

          # Node.js
          if [ -f package.json ]; then
            echo "Node project detected"
            npm ci || npm install
            if npm run lint -- --fix 2>/dev/null; then
              FIXED=true
            else
              if npx eslint . --ext .js,.ts --fix 2>/dev/null; then
                FIXED=true
              fi
            fi
          fi

          # Python
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Python project detected"
            python -m pip install --upgrade pip
            pip install black isort autoflake --no-cache-dir
            black . || true
            isort . || true
            autoflake --remove-all-unused-imports --recursive --in-place . || true
            FIXED=true
          fi

          # Go
          if [ -f go.mod ]; then
            echo "Go project detected"
            go fmt ./... || true
            FIXED=true
          fi

          # Maven
          if [ -f pom.xml ]; then
            echo "Maven project detected"
            mvn -q -DskipTests=true formatter:format || true
            FIXED=true
          fi

          # Ruby/RuboCop
          if [ -f Gemfile ]; then
            if grep -q "rubocop" Gemfile 2>/dev/null || [ -f .rubocop.yml ]; then
              echo "Ruby project with RuboCop detected"
              gem install rubocop --no-document || true
              rubocop -a || true
              FIXED=true
            fi
          fi

          if [ "$FIXED" = "false" ]; then
            echo "No auto-fixes applied."
            exit 0
          fi

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="fixes/auto-fix-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore: auto-fix lint/format issues"
            git push --set-upstream origin "$BRANCH"
            echo "pushed_branch=$BRANCH" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            exit 0
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-fix lint/format issues"
          branch: ${{ steps.commit.outputs.pushed_branch }}
          title: "Auto: fix lint/format issues"
          body: |
            هذا PR تم إنشاؤه تلقائياً بعد فشل CI ويحتوي على إصلاحات تلقائية للـ lint/format.
          labels: automated, auto-fix